[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apti-compress"
version = "1.0.0"
description = "Production Dual-Store Screen Recording Video Compression Engine and Quality Benchmark Harness"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "AptiTalent Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
apti-compress = "apti_compress.cli:main"
